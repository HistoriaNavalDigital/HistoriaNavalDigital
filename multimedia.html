<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Archivo multimedia de historia naval — HistoriaNavalDigital">
  <meta name="base-path" content="">
  <title>Archivo Multimedia — HistoriaNavalDigital</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Archivo Multimedia — HistoriaNavalDigital">
  <meta property="og:description" content="Archivo multimedia de historia naval — HistoriaNavalDigital">
  <meta property="og:image" content="https://historianavaldigital.github.io/HistoriaNavalDigital/assets/images/archive/bismarck-archive-2.jpg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <div id="site-header"></div>

  <main id="main-content" class="site-main">
    <div class="page-layout page-layout--full">
      <div class="page-content">
        <div id="breadcrumbs"></div>

        <header class="page-header">
          <h1>Archivo Multimedia</h1>
          <p>Fotografías, planos, mapas e ilustraciones relacionados con la historia naval y los buques registrados.</p>
        </header>

        <div class="search-bar"><input id="media-search" class="search-input" type="search" aria-label="Buscar recursos" placeholder="Buscar fotografías, planos o mapas…"></div>
        <div class="filter-group">
          <select id="filter-media-type" class="filter-select" aria-label="Filtrar por tipo de recurso">
            <option value="">Todos los tipos</option>
            <option value="fotografia">Fotografías</option>
            <option value="plano">Planos técnicos</option>
            <option value="mapa">Mapas</option><option value="ilustracion">Ilustraciones</option>
          </select>
        </div>

        <div class="filter-group"><select id="filter-media-ship" class="filter-select" aria-label="Filtrar por buque"></select><select id="filter-media-era" class="filter-select" aria-label="Filtrar por era"></select></div>
        <p id="media-count" aria-live="polite"></p>
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/features.js"></script>
  <script src="assets/js/data-loader.js"></script>
  <script src="assets/js/archive.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/multimedia.js"></script>
</body>
</html>
